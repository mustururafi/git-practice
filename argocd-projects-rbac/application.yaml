
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-rbac-demo
  namespace: argocd
spec:
  project: employee-restricted

  source:
    repoURL: https://github.com/mustururafi/git-practice.git
    targetRevision: main
    path: argocd-projects-rbac/nginx-app

  destination:
    server: https://kubernetes.default.svc
    namespace: employee-rbac-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
