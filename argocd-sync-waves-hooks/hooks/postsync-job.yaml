apiVersion: batch/v1
kind: Job
metadata:
  name: employee-postsync-check
  namespace: sync-waves-lab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postsync-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=================================="
              echo "Employee Management PostSync Check"
              echo "=================================="
              echo "Deployment verification started..."
              echo "PostSync verification successful!"
