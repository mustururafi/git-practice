apiVersion: batch/v1
kind: Job
metadata:
  name: employee-syncfail-check
  namespace: sync-waves-lab
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: syncfail-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=================================="
              echo "Employee Management Sync Failure"
              echo "=================================="
              echo "Deployment synchronization failed!"
              echo "Failure handling hook executed."
