apiVersion: batch/v1
kind: Job
metadata:
  name: employee-sync-check
  namespace: sync-waves-lab
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=================================="
              echo "Employee Management Sync Hook"
              echo "=================================="
              echo "Application resources are deployed."
              echo "Sync hook completed successfully!"
