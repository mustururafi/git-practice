apiVersion: batch/v1
kind: Job
metadata:
  name: employee-presync-check
  namespace: sync-waves-lab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: presync-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=================================="
              echo "Employee Management PreSync Check"
              echo "=================================="
              echo "Checking deployment prerequisites..."
              echo "PreSync validation successful!"
