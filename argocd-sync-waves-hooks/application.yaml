apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-waves-hooks-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mustururafi/git-practice.git
    targetRevision: main
    path: argocd-sync-waves-hooks
  destination:
    server: https://kubernetes.default.svc
    namespace: sync-waves-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
