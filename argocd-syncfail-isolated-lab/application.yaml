apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncfail-isolated-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mustururafi/git-practice.git
    targetRevision: main
    path: argocd-syncfail-isolated-lab/success
  destination:
    server: https://kubernetes.default.svc
    namespace: syncfail-isolated-lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
