apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mustururafi/git-practice.git
    targetRevision: main
    path: argocd-practice/nginx-app
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-nginx
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
