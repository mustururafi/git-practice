apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-nginx
  labels:
    app: argocd-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: argocd-nginx
  template:
    metadata:
      labels:
        app: argocd-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

